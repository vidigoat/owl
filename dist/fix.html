<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/addon/icon.svg" type="image/svg+xml" />
<title>Fix it — Second Set of Hands</title>
<meta name="description" content="Talk your broken appliance through a repair, on your phone. It reads the manufacturer's own manual, refuses to sell you a part it hasn't ruled the cheaper cause out for, and remembers nothing about you." />
<style>
  :root{
    --paper:#e8e5dc; --card:#f1efe8; --ink:#191714; --ink-2:#4a453d; --faint:#6a6358;
    --rule:#c9c4b6; --amber:#b8761f; --stop:#a8321f; --done:#3f6b4e;
    --screen:#14161a; --screen-2:#1c1f25; --screen-ink:#f2f0ea; --screen-dim:#98a0aa;
    --sans:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--screen);color:var(--screen-ink);font:400 17px/1.5 var(--sans);
    -webkit-font-smoothing:antialiased;min-height:100dvh;
    padding:max(16px,env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));}
  .kit{max-width:560px;margin:0 auto}
  .bar{display:flex;align-items:center;gap:10px;font:500 var(--mono);font-size:13px;color:var(--screen-dim);padding:4px 0 18px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}
  h1{font:700 clamp(1.8rem,7vw,2.4rem)/1.15 var(--sans);letter-spacing:-.02em;margin:.2em 0 .4em}
  h2{font:600 clamp(1.3rem,5.5vw,1.7rem)/1.2 var(--sans);letter-spacing:-.01em;margin:0 0 .5em}
  p{margin:0 0 1em;color:var(--screen-ink)}
  .lede{color:var(--screen-dim)}
  .card{background:var(--screen-2);border:1px solid #262a31;border-radius:14px;padding:18px;margin:0 0 14px}
  label{display:block;font:500 13px var(--mono);color:var(--screen-dim);margin:0 0 6px;letter-spacing:.03em}
  input{width:100%;font:500 20px var(--mono);background:#0f1115;color:var(--screen-ink);
    border:1px solid #2b2f37;border-radius:10px;padding:14px;margin:0 0 14px}
  input:focus{outline:2px solid var(--amber);border-color:var(--amber)}
  .btn{display:block;width:100%;font:600 18px var(--sans);text-align:center;
    background:var(--screen-ink);color:var(--screen);border:1px solid var(--screen-ink);
    border-radius:12px;padding:16px;cursor:pointer;margin:0 0 10px}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.4}
  .btn--amber{background:var(--amber);border-color:var(--amber);color:#12140f}
  .btn--quiet{background:none;color:var(--screen-dim);border-color:#2b2f37}
  .btn--stop{background:none;color:#e88;border-color:#5a2b24}
  .list{list-style:none;padding:0;margin:0 0 1em}
  .list li{padding:8px 0 8px 26px;position:relative;color:var(--screen-dim);font-size:15px}
  .list li::before{content:'';position:absolute;left:4px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
  .step{font:600 clamp(1.5rem,6vw,2rem)/1.25 var(--sans);letter-spacing:-.02em;margin:0 0 .4em}
  .detail{color:var(--screen-dim);font-size:15px;margin:0 0 1em}
  .ticks{display:flex;gap:6px;margin:0 0 14px}
  .tick{height:4px;flex:1;background:var(--screen-2);border-radius:2px}
  .tick[data-on=true]{background:var(--amber)}
  .tick[data-done=true]{background:var(--screen-dim)}
  .why{border-left:3px solid var(--amber);padding:2px 0 2px 12px;margin:0 0 16px;color:var(--screen-dim);font-size:14px}
  .why b{color:var(--screen-ink);font-weight:600}
  .said{border-left:3px solid var(--screen-dim);padding-left:12px;font-size:15px;margin:0 0 14px}
  .said[data-v=done]{border-color:var(--done)}
  .said[data-v=wrong-part],.said[data-v=not-yet]{border-color:var(--amber)}
  .said[data-v=danger]{border:0;background:var(--stop);color:#fff;border-radius:8px;padding:12px;font-weight:600}
  .small{font:400 12px/1.5 var(--mono);color:var(--screen-dim)}
  .foot{font:400 12px/1.6 var(--mono);color:var(--screen-dim);border-top:1px solid #262a31;margin-top:22px;padding-top:14px}
  .foot a{color:var(--screen-dim)}
  .hidden{display:none}
  .eye{aspect-ratio:4/3;max-width:220px;border-radius:10px;background:#0f1115;overflow:hidden;position:relative;margin:0 0 12px}
  .eye video{width:100%;height:100%;object-fit:cover;display:block}
  .refuse{border-left:3px solid var(--amber);padding-left:12px;color:var(--screen-dim);font-size:15px}
</style>
</head>
<body>
<div class="kit" id="kit">
  <header class="bar"><span class="dot" aria-hidden="true"></span><span>Second Set of Hands</span></header>
  <main id="stage" aria-live="polite"></main>
  <footer class="foot">
    Reads the manufacturer's own manual and cites the page. Won't sell you a part until the cheaper
    cause is ruled out. <a href="/privacy.html">What it keeps</a> · <a href="/">what this is</a>
  </footer>
</div>
<script src="fix.js"></script>
</body>
</html>
